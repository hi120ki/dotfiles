name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shells
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish zsh shellcheck

      - name: Run shellcheck
        run: shellcheck -S style setup.sh scripts/*.sh

      - name: Check bash syntax
        run: bash -n setup.sh scripts/*.sh

      - name: Check fish syntax
        run: fish -n .config/fish/config.fish

      - name: Check zsh syntax
        run: zsh -n .zshrc .zprofile .zshenv
